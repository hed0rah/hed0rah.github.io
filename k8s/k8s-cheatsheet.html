<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K8S REF</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&display=swap');
:root {
  --bg:      #F2F1EE;
  --surface: #FFFFFF;
  --border:  #1A1A1A;
  --border2: #D0CFC8;
  --cyan:    #007870;
  --yellow:  #906500;
  --red:     #BF1020;
  --orange:  #E85000;
  --green:   #287A38;
  --purple:  #6A0080;
  --dim:     #8A8A8A;
  --dim2:    #AAAAAA;
  --text:    #4A4A4A;
  --bright:  #1A1A1A;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
}

/* ── layout ── */
.app { display: flex; flex-direction: column; height: 100%; }

/* ── header ── */
.hdr {
  display: flex; align-items: stretch;
  background: var(--surface);
  border-top: 5px solid var(--cyan);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 26px; letter-spacing: 5px;
  color: var(--bright);
  padding: 0 22px;
  display: flex; align-items: center;
  border-right: 1px solid var(--border2);
  flex-shrink: 0;
}
.logo em { color: var(--cyan); font-style: normal; }

.search-wrap {
  display: flex; align-items: center;
  padding: 0 14px; gap: 8px;
  border-right: 1px solid var(--border2);
  flex-shrink: 0;
}
.search-wrap svg { color: var(--dim2); flex-shrink: 0; }

#search {
  background: none; border: none; outline: none;
  color: var(--bright);
  font-family: 'Space Mono', monospace;
  font-size: 11px; width: 200px;
}
#search::placeholder { color: var(--dim2); }

#search-count {
  font-size: 9px; color: var(--dim); letter-spacing: .5px;
  padding: 0 10px; white-space: nowrap;
  display: flex; align-items: center;
}

/* ── tabs ── */
.tabs {
  display: flex; flex: 1; overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  display: flex; align-items: center; gap: 7px;
  padding: 0 18px; cursor: pointer;
  color: var(--dim); font-size: 10px; letter-spacing: 1.5px;
  text-transform: uppercase; white-space: nowrap;
  border-right: 1px solid var(--border2);
  border-bottom: 3px solid transparent;
  transition: color .1s, border-color .1s;
  position: relative;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--bright); border-bottom-color: var(--tc, var(--cyan)); }

.tab-pip {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--tc, var(--cyan)); flex-shrink: 0;
}

/* ── content area ── */
.content { flex: 1; overflow: hidden; position: relative; }

.panel {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  opacity: 0; pointer-events: none;
  transition: opacity .12s;
}
.panel.active { opacity: 1; pointer-events: all; }

.panel-bar {
  font-size: 9px; color: var(--dim); letter-spacing: 2px;
  text-transform: uppercase;
  padding: 5px 16px;
  background: var(--surface); border-bottom: 1px solid var(--border2);
  border-left: 3px solid var(--cyan);
  flex-shrink: 0;
}

/* ── grid of sections ── */
.grid {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
  align-content: start;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}

/* ── section ── */
.sec {
  border-right: 1px solid var(--border2);
  border-bottom: 1px solid var(--border2);
  min-width: 0;
}
.sec.wide { grid-column: 1 / -1; }

.sec-hd {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px;
  background: var(--surface); border-bottom: 1px solid var(--border2);
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--dim); position: sticky; top: 0; z-index: 20;
}
.sec-hd-bar { width: 4px; height: 11px; flex-shrink: 0; }

/* ── command row ── */
.cmd {
  display: flex; flex-direction: column;
  border-bottom: 1px solid var(--border2);
  border-left: 3px solid transparent;
}
.cmd:last-child { border-bottom: none; }
.cmd:hover { background: #ECEAE6; }
.cmd.hi { background: rgba(0,120,112,0.06); border-left-color: var(--cyan); }

.cmd-row {
  display: flex; align-items: baseline;
  padding: 7px 14px 5px;
  gap: 0; min-width: 0; overflow: hidden;
  position: relative; cursor: pointer;
}

.cmd-ps {
  color: var(--cyan); flex-shrink: 0;
  margin-right: 8px; user-select: none;
  font-size: 11px; line-height: 1.5;
}

.cmd-pre {
  font-family: 'Space Mono', monospace;
  font-size: 11px; line-height: 1.5;
  white-space: pre;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0; flex: 1;
  color: var(--bright);
}

/* token colours -- tuned for light ground */
.cmd-pre .f { color: var(--yellow); }  /* flags: -n -f --output */
.cmd-pre .v { color: var(--cyan); }    /* placeholders: [name] [ns] */
.cmd-pre .o { color: var(--dim); }     /* optional / dim args */
.cmd-pre .p { color: var(--dim2); }    /* pipe | */
.cmd-pre .s { color: var(--yellow); }  /* strings */
.cmd-pre .k { color: var(--orange); }  /* keywords */

/* note -- always visible, italic, understated */
.cmd-note {
  padding: 2px 14px 6px 33px;
  font-size: 10px; color: var(--dim); line-height: 1.4;
  font-style: italic;
}
.cmd-note em { color: var(--text); font-style: normal; font-weight: 700; }
.cmd-note code {
  color: var(--bright); font-style: normal;
  background: var(--surface);
  border: 1px solid var(--border2);
  padding: 0 3px;
}
.cmd-note.warn { color: var(--red); }

/* ── example dropdown ── */
.cmd-ex-toggle {
  display: flex; align-items: center; gap: 5px;
  padding: 2px 14px 5px 33px;
  cursor: pointer; user-select: none;
  font-size: 9px; color: var(--dim2); letter-spacing: .5px;
  transition: color .1s;
}
.cmd-ex-toggle:hover { color: var(--cyan); }
.cmd-ex-toggle svg { transition: transform .15s; flex-shrink: 0; }
.cmd-ex-toggle.open svg { transform: rotate(90deg); }
.cmd-ex-toggle.open { color: var(--cyan); }

/* dark terminal -- only for example output blocks */
.cmd-ex-body {
  display: none;
  padding: 10px 14px 12px 33px;
  background: #1A1918;
  border-top: 1px solid #2E2D2A;
  border-left: 3px solid var(--cyan);
  margin-left: 3px;
}
.cmd-ex-body.open { display: block; }
.cmd-ex-body pre {
  font-family: 'Space Mono', monospace;
  font-size: 10px; line-height: 1.75;
  color: #7A7870; white-space: pre;
  overflow-x: auto;
}
.cmd-ex-body pre .eg-c { color: #3AB8AC; }
.cmd-ex-body pre .eg-o { color: #C8A030; }
.cmd-ex-body pre .eg-m { color: #5A5952; }
.cmd-ex-label {
  font-size: 9px; color: var(--dim2); letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 6px;
}

/* ── reference table ── */
.rtbl { width: 100%; border-collapse: collapse; }
.rtbl td {
  padding: 5px 14px; border-bottom: 1px solid var(--border2);
  font-size: 11px; vertical-align: top; line-height: 1.4;
}
.rtbl td:first-child { color: var(--orange); width: 38%; white-space: nowrap; }
.rtbl td:last-child  { color: var(--text); }
.rtbl tr:last-child td { border-bottom: none; }
.rtbl tr:hover td { background: rgba(0,0,0,0.02); }

/* ── sub-divider ── */
.sdiv {
  padding: 4px 14px; font-size: 9px; letter-spacing: 1.5px;
  color: var(--dim2); text-transform: uppercase;
  background: var(--bg); border-bottom: 1px solid var(--border2);
}

/* ── command intent classes ── */
.cmd.mutate              { border-left-color: var(--yellow); }
.cmd.mutate .cmd-ps      { color: var(--yellow); }
.cmd.mutate:hover        { background: rgba(144,101,0,0.05); }

.cmd.danger              { border-left-color: var(--red); }
.cmd.danger .cmd-ps      { color: var(--red); }
.cmd.danger:hover        { background: rgba(191,16,32,0.05); }

/* copy flash */
@keyframes flash { 0%,100%{opacity:1} 50%{opacity:.35} }
.copying { animation: flash .2s ease; }

/* copied badge */
.copy-badge {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Space Mono', monospace;
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--cyan);
  border: 1px solid rgba(0,120,112,0.35);
  background: rgba(0,120,112,0.1);
  padding: 2px 6px;
  pointer-events: none;
  animation: badgein .08s ease, badgeout .3s ease 0.9s forwards;
}
.cmd.danger .copy-badge {
  color: var(--red);
  border-color: rgba(191,16,32,0.4);
  background: rgba(191,16,32,0.08);
}
@keyframes badgein  { from { opacity:0; } to { opacity:1; } }
@keyframes badgeout { from { opacity:1; } to { opacity:0; } }

/* scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">

  <div class="hdr">
    <div class="logo"><em>K8S</em> REF</div>
    <div class="search-wrap">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" placeholder="/ search..." autocomplete="off" spellcheck="false">
    </div>
    <span id="search-count"></span>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="content" id="content"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────

function tok(raw) {
  let out = '';
  let i = 0, s = raw;
  const len = s.length;
  while (i < len) {
    if (s[i] === '[') {
      const end = s.indexOf(']', i+1);
      if (end !== -1) {
        const inner = esc(s.slice(i+1, end));
        out += `<span class="v">${inner}</span>`;
        i = end + 1; continue;
      }
    }
    if (s[i] === '{') {
      const end = s.indexOf('}', i+1);
      if (end !== -1) {
        const inner = esc(s.slice(i+1, end));
        out += `<span class="f">${inner}</span>`;
        i = end + 1; continue;
      }
    }
    if (s[i] === '`') {
      const end = s.indexOf('`', i+1);
      if (end !== -1) {
        const inner = esc(s.slice(i+1, end));
        out += `<span class="o">${inner}</span>`;
        i = end + 1; continue;
      }
    }
    if (s[i] === '|') {
      const end = s.indexOf('|', i+1);
      if (end !== -1) {
        const inner = esc(s.slice(i+1, end));
        out += `<span class="p">${inner}</span>`;
        i = end + 1; continue;
      }
    }
    if (s[i] === '"') {
      const end = s.indexOf('"', i+1);
      if (end !== -1) {
        const inner = esc(s.slice(i+1, end));
        out += `<span class="s">\"${inner}\"</span>`;
        i = end + 1; continue;
      }
    }
    out += esc(s[i]);
    i++;
  }
  return out;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _uid = 0;
function cmd(sig, note, ex, type) {
  if (typeof ex === 'string') { type = ex; ex = null; }
  const id = 'ex' + (_uid++);
  const noteHtml = note
    ? `<div class="cmd-note${note.startsWith('!')?' warn':''}">${
        note.replace(/^!/,'')
            .replace(/\*([^*]+)\*/g,'<em>$1</em>')
            .replace(/`([^`]+)`/g,'<code>$1</code>')
      }</div>`
    : '';

  let toggleHtml = '', bodyHtml = '';
  if (ex) {
    const preLines = ex.map(l => {
      const esc = l.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      if (l.t === 'c') return `<span class="eg-c">$ ${esc}</span>`;
      if (l.t === 'o') return `<span class="eg-o">${esc}</span>`;
      if (l.t === 'm') return `<span class="eg-m"># ${esc}</span>`;
      return esc;
    }).join('\n');
    toggleHtml = `
      <div class="cmd-ex-toggle" id="t${id}" onclick="toggleEx('${id}')">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="currentColor"><path d="M2 1l4 3-4 3V1z"/></svg>
        example
      </div>`;
    bodyHtml = `<div class="cmd-ex-body" id="b${id}"><pre>${preLines}</pre></div>`;
  }

  const plain = sig.replace(/[[\]{}`|"]/g,'').replace(/\s+/g,' ').trim();
  const cls = type==='m' ? ' mutate' : type==='d' ? ' danger' : '';

  return `<div class="cmd${cls}" data-plain="${plain.replace(/"/g,'&quot;')}">
    <div class="cmd-row" onclick="copyCmd(this)">
      <span class="cmd-ps">$</span>
      <span class="cmd-pre">${tok(sig)}</span>
    </div>
    ${noteHtml}
    ${toggleHtml}
    ${bodyHtml}
  </div>`;
}

function toggleEx(id) {
  const t = document.getElementById('t'+id);
  const b = document.getElementById('b'+id);
  const open = b.classList.toggle('open');
  t.classList.toggle('open', open);
}

function sec(title, color, body, wide) {
  return `<div class="sec${wide?' wide':''}">
    <div class="sec-hd">
      <div class="sec-hd-bar" style="background:${color}"></div>
      ${title}
    </div>
    <div class="sec-body">${body}</div>
  </div>`;
}

function tbl(rows) {
  return '<table class="rtbl">' +
    rows.map(([k,v]) => `<tr><td>${tok(k)}</td><td>${v}</td></tr>`).join('') +
    '</table>';
}

function sdiv(t) { return `<div class="sdiv">${t}</div>`; }

// ─────────────────────────────────────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────────────────────────────────────

const TABS = [

// ══════════════════════════════════════════════════════════════════════════════

{ id:'pods', label:'pods + exec', color:'#287A38',
  desc:'pod status, logs, exec, debug, port-forward, top',
  content: () => `

`)}

${sec('logs','#287A38',`
${cmd('kubectl logs [pod] {-n [ns]}','',

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────

const tabsEl    = document.getElementById('tabs');
const contentEl = document.getElementById('content');

TABS.forEach((tab, i) => {
  const t = document.createElement('div');
  t.className = 'tab' + (i===0 ? ' active' : '');
  t.dataset.id = tab.id;
  t.style.setProperty('--tc', tab.color);
  t.innerHTML = `<span class="tab-pip" style="background:${tab.color}"></span>${tab.label}`;
  t.addEventListener('click', () => activate(tab.id));
  tabsEl.appendChild(t);

  const p = document.createElement('div');
  p.className = 'panel' + (i===0 ? ' active' : '');
  p.id = 'panel-' + tab.id;
  p.innerHTML = `<div class="panel-bar">// ${tab.desc}</div><div class="grid">${tab.content()}</div>`;
  contentEl.appendChild(p);
});

function activate(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id===id));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id==='panel-'+id));
  clearSearch();
}

// ─────────────────────────────────────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────────────────────────────────────

const searchEl = document.getElementById('search');
const countEl  = document.getElementById('search-count');
let st;

searchEl.addEventListener('input', () => { clearTimeout(st); st = setTimeout(doSearch, 80); });
searchEl.addEventListener('keydown', e => { if (e.key==='Escape') { searchEl.value=''; clearSearch(); } });
document.addEventListener('keydown', e => {
  if (e.key==='/' && document.activeElement!==searchEl) { e.preventDefault(); searchEl.focus(); searchEl.select(); }
});

function doSearch() {
  const q = searchEl.value.trim().toLowerCase();
  if (!q) { clearSearch(); return; }

  let hits = 0;
  document.querySelectorAll('.panel').forEach(panel => {
    let panelHits = 0;
    panel.querySelectorAll('.cmd').forEach(row => {
      const text = (row.dataset.plain || '').toLowerCase() +
                   (row.querySelector('.cmd-note')?.textContent||'').toLowerCase();
      const show = text.includes(q);
      row.style.display = show ? '' : 'none';
      row.classList.toggle('hi', show);
      if (show) { hits++; panelHits++; }
    });
    panel.querySelectorAll('.sec').forEach(s => {
      const vis = [...s.querySelectorAll('.cmd')].some(r=>r.style.display!=='none');
      s.style.display = vis ? '' : 'none';
    });
    panel.querySelectorAll('.rtbl tr').forEach(r => {
      r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });

  const activePanel = document.querySelector('.panel.active');
  const activeHits  = [...(activePanel?.querySelectorAll('.cmd')||[])].some(r=>r.style.display!=='none');
  if (!activeHits && hits > 0) {
    for (const tab of TABS) {
      const p = document.getElementById('panel-'+tab.id);
      if ([...p.querySelectorAll('.cmd')].some(r=>r.style.display!=='none')) {
        activate(tab.id);
        break;
      }
    }
  }

  countEl.textContent = hits ? `${hits} result${hits!==1?'s':''}` : 'no results';
}

function clearSearch() {
  document.querySelectorAll('.cmd').forEach(r => { r.style.display=''; r.classList.remove('hi'); });
  document.querySelectorAll('.sec').forEach(s => s.style.display='');
  document.querySelectorAll('.rtbl tr').forEach(r => r.style.display='');
  countEl.textContent = '';
}

// ─────────────────────────────────────────────────────────────────────────────
// COPY ON CLICK
// ─────────────────────────────────────────────────────────────────────────────

function copyCmd(el) {
  const pre = el.querySelector('.cmd-pre');
  if (!pre) return;
  const isDanger = el.closest('.cmd') && el.closest('.cmd').classList.contains('danger');
  const raw = pre.innerText.trim();
  const txt = isDanger ? '# ' + raw : raw;
  navigator.clipboard.writeText(txt).catch(()=>{});

  const existing = el.querySelector('.copy-badge');
  if (existing) existing.remove();
  const badge = document.createElement('span');
  badge.className = 'copy-badge';
  badge.textContent = 'copied';
  el.style.position = 'relative';
  el.appendChild(badge);
  setTimeout(() => badge.remove(), 1200);
}
</script>
